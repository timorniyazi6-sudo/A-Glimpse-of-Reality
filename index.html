<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Global Hakikat Arşivi | Timor & Alfred</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        body { margin: 0; padding: 0; background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #000; z-index: 1; }

        /* KONTROLLER */
        #left-controls { position: fixed; top: 20px; left: 20px; z-index: 10001; display: flex; flex-direction: column; gap: 10px; }
        .control-box { background: rgba(0, 0, 0, 0.95); border: 1px solid #ff0000; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .lang-btn, .zoom-btn { background: none; border: none; color: #666; cursor: pointer; font-weight: 900; font-size: 14px; outline: none; transition: 0.3s; }
        .lang-btn.active, .zoom-btn:hover { color: #ff0000; text-shadow: 0 0 8px #ff0000; }

        /* MANİFESTO PANELİ */
        #manifesto-panel {
            position: fixed; bottom: 20px; left: 20px; width: 380px;
            background: rgba(5, 5, 5, 0.98); border: 2px solid #ff0000;
            padding: 20px; z-index: 10005; transition: 0.5s;
            cursor: pointer; box-shadow: 0 0 30px #000;
        }
        #manifesto-panel.expanded { width: 450px; max-height: 85vh; cursor: default; overflow-y: auto; }
        .manifesto-quote { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 5px; border-left: 4px solid #ff0000; padding-left: 12px; display: block; }
        .manifesto-subquote { color: #666; font-size: 13px; margin-bottom: 15px; display: block; padding-left: 16px; }
        .manifesto-body { color: #aaa; font-size: 13.5px; line-height: 1.7; margin-top: 15px; display: none; }
        #manifesto-panel.expanded .manifesto-body { display: block; }
        .manifesto-credits { margin-top: 25px; color: #ff0000; font-weight: 900; font-size: 11px; line-height: 1.6; border-top: 1px solid #222; padding-top: 15px; }

        /* SAĞ SIDEBAR */
        #sidebar { 
            position: fixed; top: 0; right: -500px; width: 450px; height: 100%; 
            background: rgba(5, 5, 5, 0.98); border-left: 2px solid #ff0000;
            z-index: 10002; transition: 0.5s ease-in-out; 
            padding: 30px; overflow-y: auto; box-shadow: -20px 0 50px #000;
        }
        #sidebar.active { right: 0; }
        .close-btn { color: #ff0000; cursor: pointer; float: right; font-size: 35px; margin-top: -15px; }

        /* FOTOĞRAF ALANI */
        #s-image-container { width: 100%; height: 260px; background: #000; border: 1px solid #333; margin-bottom: 20px; display: none; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
        #s-image-container img { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 768px) {
            #sidebar { width: 88vw; right: -100vw; }
            #manifesto-panel { width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; }
            #manifesto-panel::before { content: "\f129"; font-family: "Font Awesome 5 Free"; font-weight: 900; color: #ff0000; font-size: 20px; }
            #manifesto-panel.expanded { width: 90vw; height: auto; padding: 20px; left: 5vw; bottom: 5vh; display: block; }
        }

        .marker-cluster div { background-color: rgba(255, 0, 0, 0.9); color: #fff; font-weight: bold; }
        .marker-cluster { background-color: rgba(255, 0, 0, 0.1); }
    </style>
</head>
<body>

    <div id="left-controls">
        <div class="control-box">
            <button class="lang-btn active" id="btn-tr" onclick="changeLang('tr')">TR</button>
            <button class="lang-btn" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-de" onclick="changeLang('de')">DE</button>
        </div>
        <div class="control-box">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()">−</button>
        </div>
    </div>

    <div id="manifesto-panel" onclick="toggleManifesto(event)">
        <span id="m-quote" class="manifesto-quote"></span>
        <span id="m-sub" class="manifesto-subquote"></span>
        <div class="manifesto-body">
            <span id="m-text"></span>
            <div class="manifesto-credits">CURATION: TIMOR NIYAZI | STRATEGY: ALFRED BÖHLER<br>CONTACT: timor.niyazi6@gmail.com</div>
        </div>
        <div style="font-size:9px; color:#444; margin-top:10px;">[ CLICK TO READ TESTIMONY ]</div>
    </div>

    <div id="map"></div>

    <div id="sidebar">
        <span class="close-btn" onclick="closeAllPanels()">&times;</span>
        <div id="sidebar-content">
            <div id="s-image-container"><img id="s-image" src="" alt="Evidence"></div>
            <h2 id="s-title" style="color: #ff0000; font-size: 26px; font-weight: 900; margin-top: 0;"></h2>
            <div id="s-date" style="color: #444; font-size: 14px; margin-bottom: 20px;"></div>
            <div id="s-details"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

    <script>
        let currentLang = 'tr';
        let lastSelected = null;
        let map, clusterGroup;

        const translations = {
            tr: {
                quote: `"Yurtta Sulh, Cihanda Sulh."`,
                sub: `— Mustafa Kemal Atatürk`,
                text: `Bizler, <strong>Timor Niyazi</strong> ve <strong>Alfred Böhler</strong>, insanlığın en karanlık döngüsüne tanıklık ediyoruz. İkinci Dünya Savaşı'nda katledilen milyonlardan sonra dünyanın ders aldığı illüzyonu, tarihin en trajik yanılgısıdır. Eğer insanlık Birinci Dünya Savaşı'nın dehşetini gerçekten anlasaydı, ikincisi asla gerçekleşmezdi. Oysa açgözlülük, bitmek bilmeyen petrol hırsı ve mutlak hegemonya arayışı, insan hayatını sadece istatistiklere indirgedi.<br><br>Bugün bir babanın evladını kaybetmesi, ana akım medya tarafından "stratejik çıkarlar" veya "istenmeyen hasar" adı altında sterilize edilip basitleştiriliyor. Bu proje, yalanları söküp atan dijital bir anıttır. Demokrasi getirme maskesi altında yürütülen vekalet savaşlarını, kaynak hırsızlıklarını ve katliamları ifşa eder. Barışın sadece bir dilek değil, bir zorunluluk olduğuna inanıyoruz. Gerçekleri sansürsüz görmek, bu kanlı döngüyü kırmanın tek yoludur.`
            },
            en: {
                quote: `"Peace at Home, Peace in the World."`,
                sub: `— Mustafa Kemal Atatürk`,
                text: `We, <strong>Timor Niyazi</strong> and <strong>Alfred Böhler</strong>, bear witness to humanity's darkest loop. The illusion that the world learned its lesson after WWII is history's most tragic fallacy. Insatiable hunger for oil and the quest for absolute hegemony have reduced human life to mere statistics.<br><br>Today, a father losing his child is sanitized by global media under the guise of "strategic interests" or "collateral damage." This project is a digital monument that strips away the lies. Peace is not just a wish, it is a necessity. Seeing the raw, unredacted truth is the only way to break this cycle.`
            },
            de: {
                quote: `"Friede in der Heimat, Friede in der Welt."`,
                sub: `— Mustafa Kemal Atatürk`,
                text: `Wir, <strong>Timor Niyazi</strong> und <strong>Alfred Böhler</strong>, bezeugen den dunkelsten Kreislauf der Menschheit. Der Irrtum, die Welt habe nach dem Zweiten Weltkrieg gelernt, ist der tragischste Fehler der Geschichte. Gier, der Hunger nach Öl und das Streben nach Hegemonie haben Menschenleben zu bloßen Statistiken degradiert. Die ungeschönte Wahrheit zu sehen, ist der einzige Weg.`
            }
        };

        function closeAllPanels() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('manifesto-panel').classList.remove('expanded');
        }

        function toggleManifesto(e) {
            e.stopPropagation();
            document.getElementById('manifesto-panel').classList.toggle('expanded');
        }

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btn-' + lang);
            if(btn) btn.classList.add('active');
            
            document.getElementById('m-quote').innerText = translations[lang].quote;
            document.getElementById('m-sub').innerText = translations[lang].sub;
            document.getElementById('m-text').innerHTML = translations[lang].text;
            
            if(lastSelected) updateSidebar(lastSelected);
        }

        function updateSidebar(item) {
            lastSelected = item;
            document.getElementById('s-title').innerText = item.name[currentLang];
            document.getElementById('s-date').innerText = "YEAR: " + item.start;
            
            const imgBox = document.getElementById('s-image-container');
            const img = document.getElementById('s-image');
            if (item.q10_img && item.q10_img.length > 5) {
                img.src = item.q10_img;
                imgBox.style.display = 'flex';
            } else {
                imgBox.style.display = 'none';
            }
            
            let html = `<div style="background:#1a0000; border-left:4px solid #ff0000; padding:15px; margin-bottom:20px; font-style:italic; font-size:12.5px; color:#ffcccc;"><strong>PROJECTION:</strong> ${item.ai_prediction[currentLang]}</div>`;
            const d = item.details[currentLang];
            for (let i = 1; i <= 10; i++) {
                if(d[`q${i}_title`]) html += `<div style="margin-bottom:15px;"><div style="color:#fff; font-size:13.5px; font-weight:800; text-transform:uppercase;">${d[`q${i}_title`]}</div><div style="color:#999; font-size:13px; line-height:1.6;">${d[`q${i}_text`]}</div></div>`;
            }
            document.getElementById('s-details').innerHTML = html;
            document.getElementById('sidebar').classList.add('active');
        }

        function initApp() {
            map = L.map('map', { zoomSnap: 0.1, attributionControl: false }).setView([20, 10], 2.5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            clusterGroup = L.markerClusterGroup({ spiderfyOnMaxZoom: true, showCoverageOnHover: false });
            
            map.on('click', function(e) { if (e.originalEvent.target.id === 'map') closeAllPanels(); });

            changeLang('tr');

            fetch('archive_data.json')
                .then(res => res.json())
                .then(data => {
                    data.forEach(item => {
                        const marker = L.circleMarker([item.lat, item.lng], { radius: 6, fillColor: "#ff0000", color: "#fff", weight: 1, fillOpacity: 0.8 });
                        marker.on('click', (e) => { 
                            L.DomEvent.stopPropagation(e); 
                            updateSidebar(item); 
                            map.flyTo([item.lat, item.lng], 7); 
                        });
                        clusterGroup.addLayer(marker);
                    });
                    map.addLayer(clusterGroup);
                });
        }
        window.onload = initApp;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Global Hakikat Arşivi | Timor & Alfred</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        body { margin: 0; padding: 0; background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #000; z-index: 1; }

        /* KONTROLLER */
        #left-controls { position: fixed; top: 20px; left: 20px; z-index: 10001; display: flex; flex-direction: column; gap: 10px; }
        .control-box { background: rgba(0, 0, 0, 0.95); border: 1px solid #ff0000; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .lang-btn, .zoom-btn { background: none; border: none; color: #666; cursor: pointer; font-weight: 900; font-size: 14px; outline: none; transition: 0.3s; }
        .lang-btn.active, .zoom-btn:hover { color: #ff0000; text-shadow: 0 0 8px #ff0000; }

        /* MANİFESTO PANELİ */
        #manifesto-panel {
            position: fixed; bottom: 20px; left: 20px; width: 380px;
            background: rgba(5, 5, 5, 0.98); border: 2px solid #ff0000;
            padding: 20px; z-index: 10005; transition: 0.4s;
            cursor: pointer; box-shadow: 0 0 30px #000;
        }
        #manifesto-panel.expanded { width: 450px; max-height: 85vh; cursor: default; overflow-y: auto; }
        .manifesto-quote { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 5px; border-left: 4px solid #ff0000; padding-left: 12px; display: block; }
        .manifesto-subquote { color: #666; font-size: 13px; margin-bottom: 15px; display: block; padding-left: 16px; }
        .manifesto-body { color: #aaa; font-size: 13.5px; line-height: 1.7; margin-top: 15px; display: none; }
        #manifesto-panel.expanded .manifesto-body { display: block; }

        /* SIDEBAR (DETAY PANELİ) */
        #sidebar { 
            position: fixed; top: 0; right: -500px; width: 450px; height: 100%; 
            background: rgba(5, 5, 5, 0.98); border-left: 2px solid #ff0000;
            z-index: 10002; transition: 0.5s ease; 
            padding: 30px; overflow-y: auto; box-shadow: -20px 0 50px #000;
        }
        #sidebar.active { right: 0; }
        .close-btn { color: #ff0000; cursor: pointer; float: right; font-size: 35px; margin-top: -15px; }

        /* FOTOĞRAF ALANI */
        #s-image-container { 
            width: 100%; height: 260px; background: #111; border: 1px solid #333; 
            margin-bottom: 20px; display: none; align-items: center; justify-content: center; 
            overflow: hidden; border-radius: 4px;
        }
        #s-image-container img { width: 100%; height: 100%; object-fit: cover; }

        /* KAYNAKLAR (RESOURCE) BÖLÜMÜ */
        .resource-box {
            margin-top: 25px; padding: 15px; background: rgba(255, 0, 0, 0.05);
            border: 1px solid #222; border-left: 4px solid #ff0000; border-radius: 4px;
        }
        .resource-title { color: #ff0000; font-weight: 900; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; }
        .resource-link { color: #888; font-size: 11px; display: block; margin-bottom: 5px; text-decoration: none; word-break: break-all; }
        .resource-link:hover { color: #fff; }

        @media (max-width: 768px) {
            #sidebar { width: 88vw; right: -100vw; }
            #manifesto-panel { width: 45px; height: 45px; padding: 0; display: flex; align-items: center; justify-content: center; }
            #manifesto-panel.expanded { width: 90vw; height: auto; padding: 20px; left: 5vw; }
        }
    </style>
</head>
<body>

    <div id="left-controls">
        <div class="control-box">
            <button class="lang-btn active" id="btn-tr" onclick="changeLang('tr')">TR</button>
            <button class="lang-btn" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-de" onclick="changeLang('de')">DE</button>
        </div>
        <div class="control-box">
            <button class="zoom-btn" onclick="map.zoomIn()">+</button>
            <button class="zoom-btn" onclick="map.zoomOut()">−</button>
        </div>
    </div>

    <div id="manifesto-panel" onclick="toggleManifesto(event)">
        <span id="m-quote" class="manifesto-quote"></span>
        <span id="m-sub" class="manifesto-subquote"></span>
        <div class="manifesto-body">
            <span id="m-text"></span>
            <div style="margin-top:20px; color:#ff0000; font-weight:900; font-size:11px;">
                CURATION: TIMOR NIYAZI | STRATEGY: ALFRED BÖHLER<br>
                CONTACT: timor.niyazi6@gmail.com
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div id="sidebar">
        <span class="close-btn" onclick="closeAllPanels()">&times;</span>
        <div id="sidebar-content">
            <div id="s-image-container"><img id="s-image" src="" alt="Evidence"></div>
            <h2 id="s-title" style="color: #ff0000; font-size: 24px; font-weight: 900; margin-top: 0;"></h2>
            <div id="s-date" style="color: #444; font-size: 14px; margin-bottom: 20px;"></div>
            
            <div id="s-details"></div>

            <div class="resource-box">
                <div class="resource-title"><i class="fas fa-book"></i> Kaynaklar & Arşiv Linkleri</div>
                <div id="s-resources"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

    <script>
        let currentLang = 'tr';
        let lastSelected = null;
        let map, clusterGroup;

        const translations = {
            tr: {
                quote: `"Yurtta Sulh, Cihanda Sulh."`,
                sub: `— Mustafa Kemal Atatürk`,
                text: `Bizler, <strong>Timor Niyazi</strong> ve <strong>Alfred Böhler</strong>, insanlığın en karanlık döngüsüne tanıklık ediyoruz...` // Metnin geri kalanı archive_data'dan gelir
            },
            en: {
                quote: `"Peace at Home, Peace in the World."`,
                sub: `— Mustafa Kemal Atatürk`,
                text: `We, <strong>Timor Niyazi</strong> and <strong>Alfred Böhler</strong>, bear witness to humanity's darkest loop...`
            },
            de: {
                quote: `"Friede in der Heimat, Friede in der Welt."`,
                sub: `— Mustafa Kemal Atatürk`,
                text: `Wir, <strong>Timor Niyazi</strong> und <strong>Alfred Böhler</strong>, bezeugen den dunkelsten Kreislauf der Menschheit...`
            }
        };

        function closeAllPanels() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('manifesto-panel').classList.remove('expanded');
        }

        function toggleManifesto(e) {
            e.stopPropagation();
            document.getElementById('manifesto-panel').classList.toggle('expanded');
        }

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            
            document.getElementById('m-quote').innerText = translations[lang].quote;
            document.getElementById('m-sub').innerText = translations[lang].sub;
            document.getElementById('m-text').innerHTML = translations[lang].text;
            
            if(lastSelected) updateSidebar(lastSelected);
        }

        function updateSidebar(item) {
            lastSelected = item;
            document.getElementById('s-title').innerText = item.name[currentLang];
            document.getElementById('s-date').innerText = "YEAR: " + item.start;
            
            // FOTOĞRAF DÜZELTMESİ
            const imgBox = document.getElementById('s-image-container');
            const img = document.getElementById('s-image');
            if (item.q10_img) {
                img.src = item.q10_img;
                imgBox.style.display = 'flex';
            } else {
                imgBox.style.display = 'none';
            }
            
            // DETAYLAR
            let detailHtml = "";
            const d = item.details[currentLang];
            for (let i = 1; i <= 9; i++) {
                if(d[`q${i}_title`]) detailHtml += `<div style="margin-bottom:15px;"><strong style="color:#fff;">${d[`q${i}_title`]}</strong><p style="color:#999; font-size:12.5px;">${d[`q${i}_text`]}</p></div>`;
            }
            document.getElementById('s-details').innerHTML = detailHtml;

            // KAYNAKLAR (AI yerine gelen bölüm)
            // JSON'da q10_text veya linkler varsa buraya basar
            let resHtml = item.q10_link ? `<a href="${item.q10_link}" target="_blank" class="resource-link">${item.q10_link}</a>` : `<span class="resource-link">Arşiv kayıtları doğrulanmış kaynaklardan alınmıştır.</span>`;
            document.getElementById('s-resources').innerHTML = resHtml;

            document.getElementById('sidebar').classList.add('active');
        }

        function startApp() {
            map = L.map('map', { zoomSnap: 0.1, attributionControl: false }).setView([20, 10], 2.5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            clusterGroup = L.markerClusterGroup({ spiderfyOnMaxZoom: true, showCoverageOnHover: false });
            
            map.on('click', function(e) { if (e.originalEvent.target.id === 'map') closeAllPanels(); });

            changeLang('tr');

            fetch('archive_data.json')
                .then(res => res.json())
                .then(data => {
                    data.forEach(item => {
                        // TIKLAMA HATASI FİX: CircleMarker yerine standart Marker kullanarak hassasiyeti artırdık
                        const marker = L.circleMarker([item.lat, item.lng], { 
                            radius: 7, fillColor: "#ff0000", color: "#fff", weight: 2, fillOpacity: 0.9 
                        });
                        
                        marker.on('mousedown click', (e) => { // Hem mousedown hem click ekleyerek garantiledik
                            L.DomEvent.stopPropagation(e);
                            updateSidebar(item); 
                            map.flyTo([item.lat, item.lng], 7); 
                        });
                        
                        clusterGroup.addLayer(marker);
                    });
                    map.addLayer(clusterGroup);
                });
        }
        window.onload = startApp;
    </script>
</body>
</html>

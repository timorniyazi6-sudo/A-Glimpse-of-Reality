<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Global Hakikat Arşivi | Timor & Alfred</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #000; z-index: 1; position: absolute; top:0; left:0; }

        /* KONTROLLER */
        #left-controls { position: fixed; top: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .control-box { background: rgba(0, 0, 0, 0.9); border: 1px solid #ff0000; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .lang-btn { background: none; border: none; color: #666; cursor: pointer; font-weight: 900; font-size: 14px; outline: none; }
        .lang-btn.active { color: #ff0000; text-shadow: 0 0 8px #ff0000; }

        /* MANİFESTO PANELİ */
        #manifesto-panel {
            position: fixed; bottom: 20px; left: 20px; width: 350px;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #ff0000;
            padding: 20px; z-index: 10000; transition: 0.4s;
            cursor: pointer; box-shadow: 0 0 30px #000;
        }
        #manifesto-panel.expanded { width: 450px; max-height: 80vh; overflow-y: auto; cursor: default; }
        .manifesto-body { display: none; color: #aaa; font-size: 13px; line-height: 1.7; margin-top: 15px; }
        #manifesto-panel.expanded .manifesto-body { display: block; }

        /* SIDEBAR */
        #sidebar { 
            position: fixed; top: 0; right: -500px; width: 420px; height: 100%; 
            background: rgba(5, 5, 5, 0.98); border-left: 2px solid #ff0000;
            z-index: 10001; transition: 0.5s; padding: 25px; overflow-y: auto;
        }
        #sidebar.active { right: 0; }
        .close-btn { color: #ff0000; cursor: pointer; float: right; font-size: 30px; }

        /* GÖRSEL PANELİ */
        #s-image-container { width: 100%; height: 240px; background: #111; margin-bottom: 20px; display: none; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; border: 1px solid #333; }
        #s-image-container img { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 768px) { #sidebar { width: 90vw; } #manifesto-panel { width: 85vw; } }
    </style>
</head>
<body>

    <div id="left-controls">
        <div class="control-box">
            <button class="lang-btn active" id="btn-tr" onclick="changeLang('tr')">TR</button>
            <button class="lang-btn" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-de" onclick="changeLang('de')">DE</button>
        </div>
    </div>

    <div id="manifesto-panel" onclick="this.classList.toggle('expanded')">
        <strong id="m-quote" style="display:block; color:#fff; border-left:3px solid #ff0000; padding-left:10px;">"Yurtta Sulh, Cihanda Sulh."</strong>
        <small id="m-sub" style="color:#666; padding-left:13px;">— Mustafa Kemal Atatürk</small>
        <div class="manifesto-body" id="m-text"></div>
        <div style="margin-top:15px; color:#ff0000; font-size:10px; font-weight:bold;">TIMOR NIYAZI & ALFRED BÖHLER</div>
    </div>

    <div id="map"></div>

    <div id="sidebar">
        <span class="close-btn" onclick="document.getElementById('sidebar').classList.remove('active')">&times;</span>
        <div id="s-image-container"><img id="s-image" src=""></div>
        <h2 id="s-title" style="color: #ff0000; margin-top: 0;"></h2>
        <div id="s-date" style="color: #444; font-size: 14px; margin-bottom: 15px;"></div>
        <div id="s-details"></div>
        <div id="s-resources" style="margin-top:20px; padding-top:15px; border-top:1px solid #333; font-size:11px; color:#ff0000;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        let map, clusterGroup, currentLang = 'tr', lastSelected = null;

        const translations = {
            tr: { quote: `"Yurtta Sulh, Cihanda Sulh."`, sub: `— Mustafa Kemal Atatürk`, text: `Bizler, <strong>Timor Niyazi</strong> ve <strong>Alfred Böhler</strong>, insanlığın en karanlık döngüsüne tanıklık ediyoruz... Gerçekleri sansürsüz görmek, bu kanlı döngüyü kırmanın tek yoludur.` },
            en: { quote: `"Peace at Home, Peace in the World."`, sub: `— Mustafa Kemal Atatürk`, text: `We, <strong>Timor Niyazi</strong> and <strong>Alfred Böhler</strong>, bear witness to humanity's darkest loop... The unredacted truth is the only way to break the cycle.` },
            de: { quote: `"Friede in der Heimat, Friede in der Welt."`, sub: `— Mustafa Kemal Atatürk`, text: `Wir bezeugen den dunkelsten Kreislauf der Menschheit. Wahrheit ist der einzige Weg.` }
        };

        function changeLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('m-quote').innerText = translations[lang].quote;
            document.getElementById('m-sub').innerText = translations[lang].sub;
            document.getElementById('m-text').innerHTML = translations[lang].text;
            if(lastSelected) updateSidebar(lastSelected);
        }

        function updateSidebar(item) {
            lastSelected = item;
            document.getElementById('s-title').innerText = item.name[currentLang];
            document.getElementById('s-date').innerText = "YEAR: " + item.start;
            
            const imgBox = document.getElementById('s-image-container');
            const img = document.getElementById('s-image');
            if (item.q10_img) { img.src = item.q10_img; imgBox.style.display = 'flex'; } else { imgBox.style.display = 'none'; }
            
            let detailHtml = `<div style="background:#1a0000; padding:10px; margin-bottom:15px; border-left:3px solid #ff0000; font-size:12px;"><strong>PROJECTION:</strong> ${item.ai_prediction[currentLang]}</div>`;
            const d = item.details[currentLang];
            for (let i = 1; i <= 9; i++) {
                if(d[`q${i}_title`]) detailHtml += `<div style="margin-bottom:12px;"><strong style="color:#fff; font-size:13px;">${d[`q${i}_title`]}</strong><p style="color:#999; font-size:12px; margin:5px 0;">${d[`q${i}_text`]}</p></div>`;
            }
            document.getElementById('s-details').innerHTML = detailHtml;
            document.getElementById('s-resources').innerHTML = item.q10_link ? `<strong>SOURCES:</strong> <a href="${item.q10_link}" target="_blank" style="color:#888;">Visit Archive</a>` : "Verified Archive Record";
            document.getElementById('sidebar').classList.add('active');
        }

        window.onload = function() {
            map = L.map('map', { zoomControl: false }).setView([20, 10], 2.5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            clusterGroup = L.markerClusterGroup();

            fetch('archive_data.json')
                .then(res => res.json())
                .then(data => {
                    data.forEach(item => {
                        const marker = L.circleMarker([item.lat, item.lng], { radius: 7, fillColor: "#ff0000", color: "#fff", weight: 2, fillOpacity: 0.9 });
                        marker.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            updateSidebar(item);
                            map.flyTo([item.lat, item.lng], 7);
                        });
                        clusterGroup.addLayer(marker);
                    });
                    map.addLayer(clusterGroup);
                });
            changeLang('tr');
        };
    </script>
</body>
</html>
